# Complete synthetic D3 task used for examples and automated tests.
schema_version: "0.1"
task_id: synthetic_triaxial_d3
profiles:
  sensor: ../../d1/synthetic_demo/sensor.yaml
  reference: ../../d1/synthetic_demo/reference.yaml
  setup: ../../d1/synthetic_demo/setup.yaml
dataset_mapping:
  sensor_timestamp_column: sensor_time_s
  reference_timestamp_column: reference_time_s
  sensor_channels:
    c1: c1
    c2: c2
    c3: c3
  reference_channels:
    Fx: Fx_ref
    Fy: Fy_ref
    Fz: Fz_ref
d1:
  maximum_reference_uncertainty:
    Fx: 0.05
    Fy: 0.05
    Fz: 0.05
  require_reference_certificate: true
  require_acquisition_bandwidth: true
  require_sampling_process: true
  invalid_observation_policy_id: synthetic_retain_valid_rows_v1
  exclusion_record_id: synthetic_no_exclusions_v1
  exclusions_reviewed: true
d3:
  model_type: affine
  input_channels:
    - c1
    - c2
    - c3
  output_dimension: 3
  normalization:
    c1:
      minimum: -1.0
      maximum: 1.0
    c2:
      minimum: -1.0
      maximum: 1.0
    c3:
      minimum: -1.0
      maximum: 1.0
  relative_rank_tolerance: 1.0e-12
  maximum_condition_number: 2.0
  model_specific_test_id: affine_rank_condition_v1
  confounding_review_id: synthetic_fixed_conditions_review_v1
  condition_handling: held_fixed
